<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <SCRIPT src="../report/js/reportr.js"></SCRIPT>
    <SCRIPT src="../js/main.js"></SCRIPT>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
    <link rel="icon" href="../img/lms.png">
</head>

<body>
    <span style="display:none" id="hdnUserInfo" th:text="${userInfo}"></span>
    <SCRIPT src="../js/header.js"></SCRIPT>
    <div th:if="${userType == 'A'}">
         <h3>&nbsp;&nbsp;&#x25A0 &nbsp;Report Search Criteria</h3>
             <table>
                 <tr><td>Report Id <label style='color:red'>*</label><td><input type="text" id="txtReportId"></input><td colspan=6>OR</td>
                     <td>Generated Date (YYYY-MM-DD)<label style='color:red'>*</label><td><input type="text" id="txtGeneratedDate" maxlength="10"></input>
                 <tr><td><td><button onclick = "fnSearchReport();">Search Report(s)</button> <button onclick = "fnReset();">Reset</button>
             </table>
         </div>
    </div>
    <div th:unless="${userType == 'A'}" style="color:red">
        <script>document.write(accessDeniedMsg);</script>
    </div>

    <div id="divListReport"></div>
    <div id="divDtlsReport"></div>
    <br><hr><br>
    <div>
        <a th:href="@{/report}"><button>Report Menu</button></a>  <a th:href="@{/menu}"><button>Main Menu</button></a>
    </div>
</body>
</html>
