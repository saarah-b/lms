<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <SCRIPT src="../book/js/booka.js"></SCRIPT>
    <SCRIPT src="../js/main.js"></SCRIPT>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
    <link rel="icon" href="../img/lms.png">
</head>

<body>
    <span style="display:none" id="hdnUserInfo" th:text="${userInfo}"></span>
    <SCRIPT src="../js/header.js"></SCRIPT>
    <div th:if="${userType != 'M'}">
        <h3>&nbsp;&nbsp;&#x25A0 &nbsp;Add Book</h3>
        <table>
            <tr><td>Shelf Reference <label style='color:red'>*</label><td><input type="text" id="txtShelfReference" size="40"></input></tr>
            <tr><td>Location <label style='color:red'>*</label><td><input type="text" id="txtLocation" size="40"></input></tr>
            <tr><td>Edition <label style='color:red'>*</label><td><input type="text" id="txtEdition" size="40"></input></tr>
            <tr><td>BookInfo Id <label style='color:red'>*</label><td><input type="text" id="txtBookInfoId" maxlength="4" size="4"></input></tr>
        </table>
        <br><button id="btnAddBook" onclick="fnAddBook();">Add Book</button> &nbsp; <button onclick="fnReset();">Reset</button>
        &nbsp; <button id="btnAddAnotherBook" onclick="fnAddAnotherBook();" class="dbtn">Add Another Book</button>
    </div>
    <div th:unless="${userType != 'M'}" style="color:red">
        <script>document.write(accessDeniedMsg);</script>
    </div>
    <div id="divStatus" style="color:red"></div>

    <br><hr><br>
    <div>
        <a th:href="@{/book}"><button>Book Menu</button></a>  <a th:href="@{/menu}"><button>Main Menu</button></a>
    </div>
</body>
</html>
