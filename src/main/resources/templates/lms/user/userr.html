<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search User</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <SCRIPT src="../user/js/userr.js"></SCRIPT>
    <SCRIPT src="../js/main.js"></SCRIPT>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
    <link rel="icon" href="../img/lms.png">
</head>

<body>
    <span style="display:none" id="hdnUserInfo" th:text="${userInfo}"></span>
    <SCRIPT src="../js/header.js"></SCRIPT>
    <div th:if="${userType != 'M'}" >
         <h3>&nbsp;&nbsp;&#x25A0 &nbsp;User Search Criteria</h3>
         <table>
             <tr><td>User Id <label style='color:red'>*</label><td><input type="text" id="txtUserId"></input>
                 <td colspan=6>OR<td>Name <label style='color:red'>*</label><td><input type="text" id="txtUserName"></input>
             <tr><td><td><button onclick = "fnSearchUser();">Search User(s)</button> <button onclick = "fnReset();">Reset</button>
         </table>
     </div>
    <div th:unless="${userType != 'M'}" style="color:red">
        <script>document.write(accessDeniedMsg);</script>
    </div>
     <div id="divListUser"></div>
     <div id="divDtlsUser"></div>

     <br><hr><br>
    <div>
        <a th:href="@{/user}"><button>User Menu</button></a>  <a th:href="@{/menu}"><button>Main Menu</button></a>
    </div>

</body>
</html>
