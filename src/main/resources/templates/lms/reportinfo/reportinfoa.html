<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add ReportInfo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <SCRIPT src="../reportinfo/js/reportinfoa.js"></SCRIPT>
    <SCRIPT src="../js/main.js"></SCRIPT>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
    <link rel="icon" href="../img/lms.png">
</head>

<body>
    <span style="display:none" id="hdnUserInfo" th:text="${userInfo}"></span>
    <SCRIPT src="../js/header.js"></SCRIPT>
    <div th:if="${userType == 'A'}">
        <h3>&nbsp;&nbsp;&#x25A0 &nbsp;Add ReportInfo</h3>
        <table>
            <tr><td>Name <label style='color:red'>*</label><td><input type="text" id="txtName" size="40"></input></tr>
            <tr><td>SQL Statement <label style='color:red'>*</label><td><input type="text" id="txtSql" size="40"></input></tr>
            <tr><td>Generation Time (HH:MM) <label style='color:red'>*</label><td><input type="text" id="txtGenTime" size="40"></input></tr>
        </table>
        <br><button id="btnAddReportInfo" onclick="fnAddReportInfo();">Add ReportInfo</button> &nbsp; <button onclick="fnReset();">Reset</button> &nbsp;
        <button id="btnAddAnotherReportInfo" onclick="fnAddAnotherReportInfo();" class='dbtn'>Add Another ReportInfo</button>
    </div>
    <div th:unless="${userType == 'A'}" style="color:red">
        <script>document.write(accessDeniedMsg);</script>
    </div>
    <div id="divStatus" style="color:red"></div>

    <br><hr><br>
    <div>
        <a th:href="@{/reportinfo}"><button>ReportInfo Menu</button></a>  <a th:href="@{/menu}"><button>Main Menu</button></a>
    </div>
</body>
</html>
